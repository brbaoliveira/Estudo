spring:
  datasource:
    url: jdbc:mysql://localhost:3306/kontrol?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Sao_Paulo
server:
  port: 8080
app:
  jwt-secret: "kontrol-development-secret-change-this-2026"
  jwt-expiration-ms: 86400000
